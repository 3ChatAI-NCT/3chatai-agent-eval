server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health/live {
        access_log off;
        return 200 'ok';
    }

    location = /agent-eval {
        absolute_redirect off;
        return 308 /agent-eval/;
    }

    location /agent-eval/assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location /agent-eval/ {
        try_files $uri $uri/ /agent-eval/index.html;
        add_header Cache-Control 'no-store';
    }
}
